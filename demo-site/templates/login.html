{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h1>Login</h1>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form action="/login" method="POST">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="any username" autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="any password" autocomplete="current-password">

        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    <p style="margin-top: 12px; color: #666; font-size: 13px;">Accepts any non-empty username/password (demo only).</p>
</div>
{% endblock %}
